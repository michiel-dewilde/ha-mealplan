[project]
name = "mealplan"
version = "0.1.0"
description = "Home Assistant integration for weekly meal planning and shopping lists"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.14.2"
authors = [{ name = "Michiel De Wilde" }]
dependencies = ["homeassistant>=2026.7.0"]

[project.urls]
Homepage = "https://github.com/michiel-dewilde/ha-mealplan"
Issues = "https://github.com/michiel-dewilde/ha-mealplan/issues"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-homeassistant-custom-component",
  "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",  # handled by the formatter
  "D203",    # incompatible with D211
  "D213",    # incompatible with D212
  "PLR0913", # argument count is a review concern, not a lint one
  "PLR0912", # likewise for branches
  "PLR0915", # likewise for statements
  "C901",    # likewise for complexity
  "TC001",   # no TYPE_CHECKING blocks
  "TC002",
  "TC003",
  "ANN401",  # Any is legitimate for service call payloads
  "TRY300",
  "CPY001",  # every file carries an SPDX identifier instead
  "ARG001",  # platform setup signatures are fixed by Home Assistant
  "ARG002",
  "ARG004",
  "ARG005",
  "RUF001",  # × is the multiplication sign, and is meant as one
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101",    # tests assert
  "D100",
  "D103",
  "D401",
  "PLR2004", # literals in assertions are the point
  "ANN001",
  "ANN201",
  "ANN202",
  "INP001",
  "PLC0415", # a local import keeps a test self-contained
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
